org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -Dfile.encoding=UTF-8
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The Kotlin compile worker on JDK 25 keeps hitting "G1 virtual space" native OOM
# when it inherits the default G1 heap. Pinning it to the same profile as the
# main daemon (heap + parallel GC + uncompressed classes) has been the only
# stable configuration through KSP + Hilt on this machine.
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC -XX:-UseCompressedOops -XX:-UseCompressedClassPointers -Dfile.encoding=UTF-8

# KSP2 is used by default with KSP 2.2.0-2.0.2
